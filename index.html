<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#176448" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Explore terrain, elevations and watersheds across Israel and its neighboring countries using real elevation data." />
    <title>AGANIM | Israel & Neighbors</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Heebo:wght@400;500;600;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <style>
      html,body,#root{min-height:100%;margin:0}
      .startup-screen{min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f3f6f2;color:#253c31;font-family:'DM Sans',sans-serif}
      .startup-content{display:flex;flex-direction:column;align-items:center;text-align:center}
      .startup-mark{display:grid;place-items:center;width:76px;height:76px;margin-bottom:22px;border-radius:20px;background:#176448;color:#fff;box-shadow:0 10px 28px #17644824}
      .startup-title{margin:0;font-family:'Manrope','DM Sans',sans-serif;font-size:32px;font-weight:800;line-height:1.2;color:#234d3b}
      .startup-subtitle{margin:9px 0 0;font-family:'Heebo','DM Sans',sans-serif;font-size:16px;font-weight:500;color:#64776a}
      .startup-loading{margin:29px 0 0;font-size:12px;color:#829187}
      .startup-progress{width:128px;height:3px;margin-top:12px;overflow:hidden;border-radius:3px;background:#dfe8df}
      .startup-progress:after{content:'';display:block;width:40%;height:100%;border-radius:3px;background:#4c8967;animation:startup-progress 1.2s ease-in-out infinite alternate}
      .startup-he{display:none}
      html[lang="he"] .startup-en{display:none}
      html[lang="he"] .startup-he{display:flex}
      @keyframes startup-progress{from{transform:translateX(-20%)}to{transform:translateX(170%)}}
      @media(prefers-reduced-motion:reduce){.startup-progress:after{animation:none;width:100%}}
    </style>
    <script>
      try {
        const language = localStorage.getItem('watershed-language') === 'he' ? 'he' : 'en';
        document.documentElement.lang = language;
        document.documentElement.dir = language === 'he' ? 'rtl' : 'ltr';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root">
      <main class="startup-screen" role="status" aria-live="polite">
        <div class="startup-content startup-en" dir="ltr">
          <div class="startup-mark"><svg width="42" height="42" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 5 35 33H5L20 5Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="20" cy="23" r="2" fill="currentColor"/></svg></div>
          <h1 class="startup-title">AGANIM</h1>
          <p class="startup-subtitle">Terrain analysis app</p>
          <p class="startup-loading">Loading terrain…</p>
          <div class="startup-progress" aria-hidden="true"></div>
        </div>
        <div class="startup-content startup-he" dir="rtl" lang="he">
          <div class="startup-mark"><svg width="42" height="42" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M20 5 35 33H5L20 5Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="20" cy="23" r="2" fill="currentColor"/></svg></div>
          <h1 class="startup-title">אגנים</h1>
          <p class="startup-subtitle">אפליקציית ניתוח שטח</p>
          <p class="startup-loading">טוען נתוני שטח…</p>
          <div class="startup-progress" aria-hidden="true"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
